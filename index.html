<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17191b">
<link rel="manifest" href="manifest.json">
<title>Continera Door Control</title>
<style>
:root{color-scheme:dark;--bg:#17191b;--shell:#777b7c;--face:#484c4e;--key:#777b7d;--key-hi:#929697;--ink:#f2f1ec;--gold:#d8b46e}
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at 50% 42%,#3b3e40,#17191b 72%);font-family:Arial,system-ui,sans-serif;color:var(--ink)}
main{width:min(100%,430px)}.panel{position:relative;padding:24px 20px 20px;border-radius:42px 42px 48px 48px;background:linear-gradient(145deg,#a0a2a1 0%,#777b7c 24%,#555a5c 70%,#363a3c 100%);box-shadow:0 26px 60px #0009,inset 0 2px 4px #ffffff70,inset 0 -7px 12px #0008}
.face{padding:10px;border:4px solid #262a2c;border-radius:32px 32px 39px 39px;background:linear-gradient(145deg,#626668,#45494b 75%,#35393b);box-shadow:inset 0 2px 6px #0009}
.keys{display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:100px 100px 83px 90px;gap:5px;position:relative}
.key{appearance:none;min-width:0;border:0;border-radius:4px;background:linear-gradient(150deg,#929697,#686d6f 78%);box-shadow:0 5px 0 #25292b,inset 0 1px 1px #ffffff66;color:#f4f3ee;display:grid;place-items:center;cursor:pointer;touch-action:manipulation;transition:background .12s,transform .1s,box-shadow .1s}
.key:active{transform:translateY(3px);box-shadow:0 2px 0 #25292b}.key.active{background:linear-gradient(150deg,#c0a16a,#82765f);box-shadow:0 5px 0 #292722,inset 0 1px 2px #fff8,0 0 13px #d8b46e35}
.key svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.a{grid-column:1;grid-row:1}.b{grid-column:2;grid-row:1}.c{grid-column:3;grid-row:1}.d{grid-column:1;grid-row:2}.e{grid-column:2;grid-row:2;z-index:2}.f{grid-column:3;grid-row:2}.g{grid-column:2;grid-row:3}.h{grid-column:1;grid-row:4}.i{grid-column:2;grid-row:4}.j{grid-column:3;grid-row:4}
.joystick{width:100px;height:100px;border-radius:50%;padding:7px;border:5px solid #292e30;background:linear-gradient(145deg,#33383a,#85898a 52%,#363b3d);box-shadow:0 4px 0 #202426,inset 0 1px 3px #fff8;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);gap:1px}
.dir{border:0;border-radius:8px;background:transparent;color:#f4f3ee;font-size:20px;display:grid;place-items:center;padding:0;cursor:pointer}.dir.active{background:#d8b46e;color:#262626}.up{grid-area:1/2}.left{grid-area:2/1}.right{grid-area:2/3}.down{grid-area:3/2}.hub{grid-area:2/2;align-self:center;justify-self:center;width:9px;height:9px;border-radius:50%;background:#f5f4ed;box-shadow:0 0 4px #fff}
.lock{width:32px;height:36px}.disabled{opacity:.24;cursor:default;box-shadow:0 4px 0 #25292b}.disabled:active{transform:none}
@media(max-width:360px){.panel{padding:17px 13px}.face{padding:7px}.keys{grid-template-rows:86px 90px 72px 78px}.joystick{width:86px;height:86px}.key svg{width:26px;height:26px}}
</style>
</head>
<body>
<main>
<section class="panel" aria-label="Панель керування DAF XG+">
<div class="face"><div class="keys">
<button class="key a" data-toggle="window-left" aria-label="Кнопка верхня ліва" aria-pressed="false"><svg viewBox="0 0 32 32"><rect x="6" y="4" width="20" height="24" rx="3"/><path d="M11 22V10h10v12M16 25V13m-3 3 3-3 3 3"/></svg></button>
<button class="key b" data-toggle="heat" aria-label="Обігрів дзеркал" aria-pressed="false"><svg viewBox="0 0 32 32"><path d="M8 25c-4-5 4-7 0-13M16 25c-4-5 4-7 0-13M24 25c-4-5 4-7 0-13"/></svg></button>
<button class="key c" data-toggle="window-right" aria-label="Кнопка верхня права" aria-pressed="false"><svg viewBox="0 0 32 32"><rect x="6" y="4" width="20" height="24" rx="3"/><path d="M11 10v12h10V10M16 7v11m-3-3 3 3 3-3"/></svg></button>
<button class="key d" data-toggle="mirror-left" aria-label="Ліва кнопка біля джойстика" aria-pressed="false"><svg viewBox="0 0 32 32"><rect x="7" y="8" width="18" height="16" rx="4"/><path d="M12 12h8v8h-8z"/></svg></button>
<div class="e"><div class="joystick" aria-label="Джойстик регулювання дзеркал">
<button class="dir up" data-dir="up" aria-label="Вгору">⌃</button><button class="dir left" data-dir="left" aria-label="Ліворуч">‹</button><span class="hub"></span><button class="dir right" data-dir="right" aria-label="Праворуч">›</button><button class="dir down" data-dir="down" aria-label="Вниз">⌄</button>
</div></div>
<button class="key f" data-toggle="mirror-right" aria-label="Права кнопка біля джойстика" aria-pressed="false"><svg viewBox="0 0 32 32"><rect x="7" y="8" width="18" height="16" rx="4"/><path d="M12 12h8v8h-8z"/></svg></button>
<button class="key g" data-toggle="unlock" aria-label="Відімкнути замок" aria-pressed="false"><svg class="lock" viewBox="0 0 32 36"><rect x="5" y="15" width="22" height="17" rx="2"/><path d="M10 15V10a6 6 0 0 1 12 0v3M16 21v6"/></svg></button>
<button class="key disabled h" disabled aria-label="Неактивна нижня ліва кнопка"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="10"/></svg></button>
<button class="key i" data-toggle="lock" aria-label="Замкнути замок" aria-pressed="false"><svg class="lock" viewBox="0 0 32 36"><rect x="5" y="15" width="22" height="17" rx="2"/><path d="M10 15V10a6 6 0 0 1 12 0v5M16 21v6"/></svg></button>
<button class="key disabled j" disabled aria-label="Неактивна нижня права кнопка"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="10"/></svg></button>
</div></div></section>
</main>
<script>
const STORAGE='continera-door-control-panel-v3';
let state={};try{state=JSON.parse(localStorage.getItem(STORAGE)||'{}')||{}}catch{}
function save(){localStorage.setItem(STORAGE,JSON.stringify(state))}
function render(){document.querySelectorAll('[data-toggle]').forEach(b=>{const active=!!state[b.dataset.toggle];b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active))});document.querySelectorAll('[data-dir]').forEach(b=>b.classList.toggle('active',state.direction===b.dataset.dir))}
document.querySelectorAll('[data-toggle]').forEach(b=>b.addEventListener('click',()=>{const id=b.dataset.toggle;state[id]=!state[id];save();render()}));
document.querySelectorAll('[data-dir]').forEach(b=>{
  const press=()=>b.classList.add('active');
  const release=()=>b.classList.remove('active');
  b.addEventListener('pointerdown',event=>{event.preventDefault();b.setPointerCapture(event.pointerId);press()});
  b.addEventListener('pointerup',release);
  b.addEventListener('pointercancel',release);
  b.addEventListener('lostpointercapture',release);
  b.addEventListener('blur',release);
  b.addEventListener('keydown',event=>{if(event.key===' '||event.key==='Enter')press()});
  b.addEventListener('keyup',event=>{if(event.key===' '||event.key==='Enter')release()});
});
render();
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
</body></html>
